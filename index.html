<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>DEAD ZONE — Zombie Shooter</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#0a0f14;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;font-family:'Courier New',Courier,monospace}
canvas{position:fixed;inset:0;display:block}
#hud{position:fixed;inset:0;pointer-events:none;color:#d6efd6;z-index:5}
#top{position:absolute;top:calc(8px + env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start}
.panel{background:rgba(5,12,8,.55);border:1px solid rgba(159,227,160,.35);padding:8px 10px;border-radius:4px;font-size:12px;letter-spacing:1px}
#hpWrap{width:170px}
#hpBar{height:10px;background:#2a1414;border:1px solid #77aa77;margin-top:4px}
#hpFill{height:100%;width:100%;background:linear-gradient(90deg,#63d463,#9fe3a0);transition:width .15s}
#hpWrap.low #hpFill{background:linear-gradient(90deg,#d44,#f80);animation:pulse .6s infinite alternate}
@keyframes pulse{from{opacity:.5}to{opacity:1}}
#ammo{font-size:26px;color:#ffe08a;text-align:right}
#cross{position:absolute;left:50%;top:50%;width:0;height:0}
#cross i{position:absolute;background:#cfeecf;box-shadow:0 0 4px #000}
#cross i:nth-child(1){width:2px;height:10px;left:-1px;top:-16px}
#cross i:nth-child(2){width:2px;height:10px;left:-1px;top:6px}
#cross i:nth-child(3){width:10px;height:2px;left:-16px;top:-1px}
#cross i:nth-child(4){width:10px;height:2px;left:6px;top:-1px}
#cross i:nth-child(5){width:2px;height:2px;left:-1px;top:-1px;background:#9fe3a0}
.ctl{position:absolute;pointer-events:auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;letter-spacing:1px}
#fireBtn{right:26px;bottom:calc(34px + env(safe-area-inset-bottom));width:96px;height:96px;background:radial-gradient(circle at 35% 30%,rgba(255,90,70,.85),rgba(140,20,10,.85));border:2px solid #ff9c80;color:#ffe; font-size:16px}
#fireBtn:active{transform:scale(.93)}
#reloadBtn{right:140px;bottom:calc(60px + env(safe-area-inset-bottom));width:64px;height:64px;background:rgba(20,40,25,.75);border:2px solid #77aa77;color:#cfeecf;font-size:11px}
#stickBase{position:absolute;width:110px;height:110px;border:2px solid rgba(159,227,160,.5);border-radius:50%;display:none;pointer-events:none}
#stickKnob{position:absolute;width:52px;height:52px;border-radius:50%;background:rgba(159,227,160,.45);left:29px;top:29px}
#dmg{position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse at center,transparent 52%,rgba(200,0,0,.55));pointer-events:none}
#banner{position:absolute;left:0;right:0;top:26%;text-align:center;font-size:34px;letter-spacing:6px;color:#9fe3a0;text-shadow:0 0 18px #2a5,0 2px 0 #000;opacity:0}
#banner.show{animation:ban 2.4s ease forwards}
@keyframes ban{0%{opacity:0;transform:scale(.7)}15%{opacity:1;transform:scale(1.05)}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}
.pop{position:absolute;left:50%;top:40%;font-size:15px;font-weight:bold;text-shadow:0 1px 2px #000;animation:pop .9s ease forwards}
@keyframes pop{0%{opacity:0;transform:translateY(6px)}20%{opacity:1}100%{opacity:0;transform:translateY(-46px)}}
.screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(4,8,6,.82);color:#d6efd6;text-align:center;padding:20px}
.screen h1{font-size:44px;letter-spacing:8px;color:#9fe3a0;text-shadow:0 0 24px #2a5}
.screen h2{font-size:15px;letter-spacing:3px;color:#c9a76a;margin:8px 0 18px}
.screen p{font-size:12px;line-height:1.9;opacity:.85;max-width:340px}
.btn{margin-top:26px;pointer-events:auto;background:linear-gradient(180deg,#3f7a44,#25492a);border:2px solid #9fe3a0;color:#eaffe0;font-family:inherit;font-size:18px;letter-spacing:4px;padding:14px 44px;border-radius:6px}
.btn:active{transform:scale(.95)}
.hidden{display:none!important}
#error{position:fixed;bottom:10px;left:10px;right:10px;background:#400;color:#fcc;padding:10px;font-size:11px;z-index:100;display:none;border:1px solid #f66}
</style>
</head>
<body>
<div id="hud">
  <div id="top">
    <div class="panel" id="hpWrap">HP <span id="hpNum">100</span><div id="hpBar"><div id="hpFill"></div></div></div>
    <div class="panel"><div id="ammo">30 / ∞</div><div>SCORE <span id="score">0</span> · WAVE <span id="wave">1</span> · KILLS <span id="kills">0</span></div></div>
  </div>
  <div id="cross"><i></i><i></i><i></i><i></i><i></i></div>
  <div id="stickBase"><div id="stickKnob"></div></div>
  <div id="dmg"></div>
  <div id="banner"></div>
  <div id="fireBtn" class="ctl">FIRE</div>
  <div id="reloadBtn" class="ctl">RLD</div>
</div>
<div id="menu" class="screen">
  <h1>DEAD ZONE</h1><h2>LOW-POLY ZOMBIE SURVIVAL</h2>
  <p>LEFT SIDE — move joystick<br>RIGHT SIDE — drag to aim<br>HOLD FIRE — shoot · RLD — reload<br>Headshots deal double damage.<br><br>Desktop: WASD move, hold right-mouse to aim, click to shoot, R reload.</p>
  <button class="btn" id="startBtn">START</button>
</div>
<div id="over" class="screen hidden">
  <h1 style="color:#f66;text-shadow:0 0 24px #800">YOU DIED</h1>
  <p id="finalStats"></p>
  <button class="btn" id="restartBtn">RESTART</button>
</div>
<div id="error"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';

// Error display
function showError(msg){
  const el=$('error');
  el.style.display='block';
  el.textContent='ERROR: '+msg;
  console.error('GAME ERROR:',msg);
}

window.onerror=function(msg,url,line,col,error){
  showError(msg+' at line '+line);
  return false;
};

/* ---------- core ---------- */
let renderer,scene,camera,clock;
let state='menu';
const player={pos:new THREE.Vector3(0,0,10),hp:100};
let yaw=0,pitch=0,bobT=0,shake=0,recoil=0,dmgOp=0;
let zombies=[],zGroups=[],showcase=[],statics=[],colliders=[];
let wave=0,toSpawn=0,spawnT=0,interT=0,cleared=false;
let kills=0,score=0,ammo=30,mag=30,reloading=false,reloadT=0,firing=false,shotCd=0,lastHurt=0;
const $=id=>document.getElementById(id);
const hud=$('hud'),dmgEl=$('dmg');

// Initialize Three.js
try{
  renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.15;
  document.body.prepend(renderer.domElement);
  console.log('Three.js renderer initialized');
}catch(e){
  showError('Failed to initialize WebGL: '+e.message);
  throw e;
}

scene=new THREE.Scene();
scene.background=new THREE.Color(0x0a0f14);
scene.fog=new THREE.Fog(0x0a0f14,12,75);
camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.05,250);
camera.rotation.order='YXZ';
scene.add(camera);
clock=new THREE.Clock();

/* lights */
scene.add(new THREE.HemisphereLight(0x3a4a5f,0x151a12,0.75));
const moonL=new THREE.DirectionalLight(0xbfd4ff,0.95);
moonL.castShadow=true;
moonL.shadow.mapSize.set(1024,1024);
moonL.shadow.camera.left=-30;
moonL.shadow.camera.right=30;
moonL.shadow.camera.top=30;
moonL.shadow.camera.bottom=-30;
moonL.shadow.camera.near=5;
moonL.shadow.camera.far=120;
moonL.shadow.bias=-0.0004;
scene.add(moonL,moonL.target);

/* sky */
(function(){
  const n=350,p=new Float32Array(n*3);
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,e=Math.random()*Math.PI*0.45+0.08,r=170;
    p.set([Math.cos(a)*Math.cos(e)*r,Math.sin(e)*r,Math.sin(a)*Math.cos(e)*r],i*3);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(p,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xbdd0ff,size:1.6,sizeAttenuation:false,fog:false,transparent:true,opacity:.8})));
  const m=new THREE.Mesh(new THREE.SphereGeometry(5,10,10),new THREE.MeshBasicMaterial({color:0xe8f1ff,fog:false}));
  m.position.set(70,60,-90);
  scene.add(m);
})();

/* ground */
let ground;
(function(){
  const g=new THREE.PlaneGeometry(140,140,46,46),pos=g.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i),y=pos.getY(i),d=Math.hypot(x,y),f=Math.min(1,Math.max(0,(d-8)/30));
    pos.setZ(i,(Math.sin(x*.32)*Math.cos(y*.27)+Math.sin(x*.11+y*.17))*0.3*f);
  }
  g.rotateX(-Math.PI/2);
  g.computeVertexNormals();
  ground=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0x253225,flatShading:true,roughness:1}));
  ground.receiveShadow=true;
  scene.add(ground);
  statics.push(ground);
})();

/* props */
function prop(mesh,r){
  mesh.castShadow=true;
  mesh.receiveShadow=true;
  scene.add(mesh);
  statics.push(mesh);
  if(r)colliders.push({x:mesh.position.x,z:mesh.position.z,r:r});
}
const woodM=new THREE.MeshStandardMaterial({color:0x3a2c1e,flatShading:true,roughness:1});
const rockM=new THREE.MeshStandardMaterial({color:0x55605c,flatShading:true,roughness:1});
const crateM=new THREE.MeshStandardMaterial({color:0x6b5433,flatShading:true,roughness:1});
const rustM=new THREE.MeshStandardMaterial({color:0x7a4028,flatShading:true,roughness:.9,metalness:.3});

for(let i=0;i<7;i++){
  const a=Math.random()*Math.PI*2,r=10+Math.random()*26,g=new THREE.Group();
  const t=new THREE.Mesh(new THREE.CylinderGeometry(.06,.18,3.2,5),woodM);
  t.position.y=1.6;
  g.add(t);
  for(let b=0;b<2;b++){
    const br=new THREE.Mesh(new THREE.CylinderGeometry(.03,.05,1.4,4),woodM);
    br.position.y=1.8+b*.6;
    br.rotation.set(Math.random()*1.2-.6,Math.random()*3,Math.PI/3);
    g.add(br);
  }
  const x=Math.cos(a)*r,z=Math.sin(a)*r;
  g.position.set(x,0,z);
  g.children.forEach(c=>{c.castShadow=true});
  scene.add(g);
  statics.push(g);
  colliders.push({x:x,z:z,r:.4});
}

for(let i=0;i<12;i++){
  const a=Math.random()*Math.PI*2,r=9+Math.random()*28,s=.4+Math.random()*.9;
  const m=new THREE.Mesh(new THREE.IcosahedronGeometry(s,0),rockM);
  m.position.set(Math.cos(a)*r,s*.4,Math.sin(a)*r);
  m.rotation.y=Math.random()*3;
  prop(m,s*.8);
}

for(let i=0;i<5;i++){
  const a=Math.random()*Math.PI*2,r=9+Math.random()*26;
  const m=new THREE.Mesh(new THREE.BoxGeometry(1.1,1.1,1.1),crateM);
  m.position.set(Math.cos(a)*r,.55,Math.sin(a)*r);
  m.rotation.y=Math.random();
  prop(m,.8);
}

for(let i=0;i<5;i++){
  const a=Math.random()*Math.PI*2,r=9+Math.random()*26;
  const m=new THREE.Mesh(new THREE.CylinderGeometry(.4,.4,1.1,7),rustM);
  m.position.set(Math.cos(a)*r,.55,Math.sin(a)*r);
  prop(m,.55);
}

/* ---------- gun viewmodel ---------- */
const gun=new THREE.Group();
let magMesh,gunTip,flashM1,flashM2,muzzleLight,flashT=0;
(function(){
  const dk=new THREE.MeshStandardMaterial({color:0x1c2026,flatShading:true,roughness:.55,metalness:.45});
  const dk2=new THREE.MeshStandardMaterial({color:0x2c3138,flatShading:true,roughness:.6,metalness:.4});
  const B=(w,h,d,x,y,z,m)=>{
    const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m||dk);
    o.position.set(x,y,z);
    gun.add(o);
    return o;
  };
  B(.06,.09,.44,0,0,0);
  const bar=new THREE.Mesh(new THREE.CylinderGeometry(.015,.015,.45,6),dk);
  bar.rotation.x=Math.PI/2;
  bar.position.set(0,.01,-.62);
  gun.add(bar);
  const hg=new THREE.Mesh(new THREE.CylinderGeometry(.034,.042,.3,6),dk2);
  hg.rotation.x=Math.PI/2;
  hg.position.set(0,-.005,-.33);
  gun.add(hg);
  B(.05,.11,.3,0,-.02,.36);
  const gr=B(.04,.12,.05,0,-.1,.14);
  gr.rotation.x=.3;
  magMesh=B(.045,.22,.09,0,-.15,-.02,dk2);
  magMesh.rotation.x=.12;
  B(.03,.05,.18,0,.085,-.02);
  B(.02,.07,.02,0,.06,-.78);
  gunTip=new THREE.Object3D();
  gunTip.position.set(0,.01,-.86);
  gun.add(gunTip);
  const fm=new THREE.MeshBasicMaterial({color:0xffc36b,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide});
  flashM1=new THREE.Mesh(new THREE.PlaneGeometry(.28,.28),fm);
  flashM2=flashM1.clone();
  flashM2.rotation.y=Math.PI/2;
  flashM1.visible=flashM2.visible=false;
  gunTip.add(flashM1,flashM2);
  muzzleLight=new THREE.PointLight(0xffa649,0,7);
  gunTip.add(muzzleLight);
  gun.position.set(.24,-.2,-.45);
  gun.visible=false;
  camera.add(gun);
})();

/* ---------- zombie factory ---------- */
const TYPES={
  walker:{scale:1,hp:100,speed:1.9,dmg:10,score:100,range:1.6,skin:0x8fae7c,cloth:0x5d6b52,anim:6,swing:.55},
  runner:{scale:.92,hp:70,speed:3.7,dmg:7,score:150,range:1.5,skin:0xa8c189,cloth:0x6b5a44,anim:10,swing:.85},
  brute:{scale:1.38,hp:320,speed:1.15,dmg:22,score:300,range:2.1,skin:0x6d8f62,cloth:0x47473d,anim:4,swing:.4}
};
const ZG={};
(function(){
  ZG.head=new THREE.BoxGeometry(.42,.46,.42);
  ZG.eye=new THREE.BoxGeometry(.09,.07,.03);
  ZG.patch=new THREE.BoxGeometry(.2,.06,.2);
  ZG.torso=new THREE.BoxGeometry(.5,.62,.26);
  ZG.pelvis=new THREE.BoxGeometry(.36,.22,.24);
  ZG.arm=new THREE.BoxGeometry(.11,.62,.11);
  ZG.arm.translate(0,-.27,0);
  ZG.hand=new THREE.BoxGeometry(.1,.14,.06);
  ZG.leg=new THREE.BoxGeometry(.14,.92,.14);
  ZG.leg.translate(0,-.44,0);
  ZG.foot=new THREE.BoxGeometry(.14,.08,.26);
})();
const eyeMat=new THREE.MeshStandardMaterial({color:0x111111,emissive:0xffe08a,emissiveIntensity:1.3});
let zid=0;

function makeZombie(type,x,z,show){
  const c=TYPES[type],g=new THREE.Group();
  const skin=new THREE.MeshStandardMaterial({color:c.skin,flatShading:true,roughness:.95});
  const cloth=new THREE.MeshStandardMaterial({color:c.cloth,flatShading:true,roughness:1});
  const dark=new THREE.MeshStandardMaterial({color:new THREE.Color(c.skin).multiplyScalar(.45),flatShading:true,roughness:1});
  const M=(geo,mat,part)=>{
    const m=new THREE.Mesh(geo,mat);
    m.castShadow=true;
    m.userData.part=part;
    return m;
  };
  const torso=M(ZG.torso,cloth,'body');
  torso.position.y=1.28;
  const pelvis=M(ZG.pelvis,cloth,'body');
  pelvis.position.y=.97;
  const headG=new THREE.Group();
  headG.position.y=1.66;
  headG.add(M(ZG.head,skin,'head'));
  const e1=new THREE.Mesh(ZG.eye,eyeMat);
  e1.position.set(.1,.03,.21);
  e1.userData.part='head';
  const e2=e1.clone();
  e2.position.x=-.1;
  const pa=M(ZG.patch,dark,'head');
  pa.position.set(-.08,.24,0);
  pa.rotation.y=.4;
  headG.add(e1,e2,pa);
  const shL=new THREE.Group(),shR=new THREE.Group();
  shL.position.set(.31,1.5,0);
  shR.position.set(-.31,1.5,0);
  [shL,shR].forEach(s=>{
    const a=M(ZG.arm,skin,'body');
    const h=M(ZG.hand,skin,'body');
    h.position.y=-.62;
    s.add(a,h);
  });
  const legL=new THREE.Group(),legR=new THREE.Group();
  legL.position.set(.13,.95,0);
  legR.position.set(-.13,.95,0);
  [legL,legR].forEach(s=>{
    const l=M(ZG.leg,skin,'body');
    const f=M(ZG.foot,skin,'body');
    f.position.set(0,-.9,.06);
    s.add(l,f);
  });
  g.add(torso,pelvis,headG,shL,shR,legL,legR);
  const s=c.scale*(0.92+Math.random()*0.16);
  g.scale.setScalar(s);
  g.position.set(x,0,z);
  scene.add(g);
  const z={
    id:zid++,group:g,type,cfg:c,
    hp:c.hp*(1+(wave-1)*.12),
    t:Math.random()*10,
    state:show?'show':'rise',
    riseT:0,attackT:0,hitDone:false,hitReact:0,
    cd:1+Math.random(),flash:0,deathT:0,
    dirF:1,fallZ:0,groanT:2+Math.random()*5,
    mats:[skin,cloth,dark],
    parts:{shL,shR,legL,legR,headG,torso},
    speed:c.speed*(.85+Math.random()*.3)
  };
  g.traverse(o=>o.userData.z=z);
  if(show)showcase.push(z);
  else{zombies.push(z);zGroups.push(g);}
  return z;
}

function spawnZombie(){
  let t='walker';
  const r=Math.random();
  if(wave>=2&&r<.3)t='runner';
  if(wave>=4&&r>.85)t='brute';
  const a=Math.random()*Math.PI*2,r2=24+Math.random()*8;
  const z=makeZombie(t,player.pos.x+Math.cos(a)*r2,player.pos.z+Math.sin(a)*r2);
  dirtBurst(z.group.position);
}

/* ---------- particles / tracers / decals ---------- */
const parts=[];
const pGeo=new THREE.BoxGeometry(.07,.07,.07);

function spawnPart(x,y,z,vx,vy,vz,color,life,grav){
  let p=parts.find(q=>!q.active);
  if(!p){
    if(parts.length>220)return;
    p={m:new THREE.Mesh(pGeo,new THREE.MeshBasicMaterial({transparent:true})),v:new THREE.Vector3(),active:false};
    parts.push(p);
  }
  p.active=true;
  p.m.visible=true;
  p.m.position.set(x,y,z);
  p.v.set(vx,vy,vz);
  p.life=p.life0=life;
  p.grav=grav||9;
  p.m.material.color.set(color);
  p.m.material.opacity=1;
  const s=.5+Math.random();
  p.m.scale.set(s,s,s);
  scene.add(p.m);
}

function blood(p,n,sp){
  for(let i=0;i<n;i++)spawnPart(p.x,p.y,p.z,(Math.random()-.5)*sp,Math.random()*sp*.7,(Math.random()-.5)*sp,0x8f1010,.4+Math.random()*.3);
}

function dirtBurst(pos){
  for(let i=0;i<10;i++)spawnPart(pos.x+(Math.random()-.5),.1,pos.z+(Math.random()-.5),(Math.random()-.5)*2,Math.random()*3,(Math.random()-.5)*2,0x4a3a28,.6);
}

const tracers=[];
function tracer(a,b){
  const d=b.clone().sub(a),len=d.length();
  if(len<1)return;
  let t=tracers.find(q=>!q.active);
  if(!t){
    if(tracers.length>14)return;
    t={m:new THREE.Mesh(new THREE.BoxGeometry(.015,.015,1),new THREE.MeshBasicMaterial({color:0xffd27a,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false})),active:false};
    tracers.push(t);
  }
  t.active=true;
  t.m.visible=true;
  t.m.position.copy(a).addScaledVector(d,.5);
  t.m.scale.set(1,1,len);
  t.m.lookAt(b);
  t.life=.07;
  scene.add(t.m);
}

const decals=[];
function decal(x,z,s){
  let d=decals.find(q=>!q.active);
  if(!d){
    if(decals.length>24)return;
    d={m:new THREE.Mesh(new THREE.CircleGeometry(.5,7),new THREE.MeshBasicMaterial({color:0x4d0a0a,transparent:true,depthWrite:false})),active:false};
    d.m.rotation.x=-Math.PI/2;
    d.m.renderOrder=1;
    decals.push(d);
  }
  d.active=true;
  d.m.visible=true;
  d.m.position.set(x,.02+Math.random()*.01,z);
  d.m.rotation.z=Math.random()*7;
  const k=s*(0.8+Math.random()*.6);
  d.m.scale.set(k,k,1);
  d.life=d.life0=14;
  scene.add(d.m);
}

/* ---------- audio ---------- */
let ac,master,noiseBuf;

function initAudio(){
  if(ac)return;
  try{
    const AudioContext=window.AudioContext||window.webkitAudioContext;
    if(!AudioContext){
      console.warn('Web Audio API not supported');
      return;
    }
    ac=new AudioContext();
    master=ac.createGain();
    master.gain.value=.55;
    master.connect(ac.destination);
    noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);
    const d=noiseBuf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    console.log('Audio initialized');
  }catch(e){
    console.error('Audio init failed:',e);
    ac=null;
  }
}

function env(g,t,peak,dur){
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(peak,t+.005);
  g.gain.exponentialRampToValueAtTime(.001,t+dur);
}

function noise(dur,vol,freq,type){
  if(!ac)return;
  const t=ac.currentTime,s=ac.createBufferSource();
  s.buffer=noiseBuf;
  s.loop=true;
  const f=ac.createBiquadFilter();
  f.type=type||'lowpass';
  f.frequency.value=freq;
  const g=ac.createGain();
  env(g,t,vol,dur);
  s.connect(f);
  f.connect(g);
  g.connect(master);
  s.start(t);
  s.stop(t+dur+.05);
}

function tone(type,f0,f1,dur,vol){
  if(!ac)return;
  const t=ac.currentTime,o=ac.createOscillator();
  o.type=type;
  o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
  const g=ac.createGain();
  env(g,t,vol,dur);
  o.connect(g);
  g.connect(master);
  o.start(t);
  o.stop(t+dur+.05);
}

const sShoot=()=>{noise(.14,.7,2200);tone('square',150,45,.1,.5);};
const sDry=()=>noise(.05,.25,1500,'highpass');
const sHit=()=>noise(.07,.4,800);
const sHead=()=>tone('sine',900,1400,.09,.4);
const sHurt=()=>tone('sawtooth',120,50,.25,.6);
const sDeath=()=>tone('sawtooth',140,40,.9,.5);
const sWave=()=>{tone('sine',70,45,.6,.7);noise(.4,.3,300);};

const sGroan=v=>{
  if(!ac||v<=0)return;
  const t=ac.currentTime,o=ac.createOscillator();
  o.type='sawtooth';
  const f=70+Math.random()*40;
  o.frequency.setValueAtTime(f,t);
  o.frequency.linearRampToValueAtTime(f*.7,t+.7);
  const fl=ac.createBiquadFilter();
  fl.type='lowpass';
  fl.frequency.value=320;
  const g=ac.createGain();
  env(g,t,v,.8);
  o.connect(fl);
  fl.connect(g);
  g.connect(master);
  o.start(t);
  o.stop(t+.9);
};

function sReload(){
  noise(.05,.3,1200);
  setTimeout(()=>noise(.05,.3,900),500);
  setTimeout(()=>noise(.06,.35,1400),1200);
}

/* ---------- HUD ---------- */
function updateHUD(){
  $('ammo').textContent=ammo+' / ∞';
  $('score').textContent=score;
  $('wave').textContent=wave;
  $('kills').textContent=kills;
  $('hpFill').style.width=Math.max(0,player.hp)+'%';
  $('hpNum').textContent=Math.max(0,Math.ceil(player.hp));
  $('hpWrap').classList.toggle('low',player.hp<30);
}

function banner(t){
  const b=$('banner');
  b.textContent=t;
  b.classList.remove('show');
  void b.offsetWidth;
  b.classList.add('show');
}

function popup(t,c){
  const d=document.createElement('div');
  d.className='pop';
  d.style.color=c||'#ffd77a';
  d.textContent=t;
  d.style.marginLeft=(Math.random()*60-30)+'px';
  hud.appendChild(d);
  setTimeout(()=>d.remove(),900);
}

/* ---------- combat ---------- */
const ray=new THREE.Raycaster();
ray.far=120;
const tv1=new THREE.Vector3(),tv2=new THREE.Vector3();

function shoot(){
  ammo--;
  shotCd=.105;
  recoil=1;
  shake=Math.min(shake+.05,.3);
  pitch=Math.min(pitch+.006,1.25);
  flashT=.05;
  flashM1.visible=flashM2.visible=true;
  flashM1.rotation.z=Math.random()*7;
  const sc=.7+Math.random()*.6;
  flashM1.scale.set(sc,sc,1);
  flashM2.scale.set(sc,sc,1);
  muzzleLight.intensity=3;
  sShoot();
  camera.getWorldPosition(tv1);
  tv2.set((Math.random()-.5)*.012,(Math.random()-.5)*.012,-1).normalize().applyQuaternion(camera.quaternion);
  ray.set(tv1,tv2);
  const hits=ray.intersectObjects(zGroups.concat(statics),true);
  let end=tv1.clone().addScaledVector(tv2,80);
  for(const h of hits){
    const z=h.object.userData.z;
    if(z&&z.state==='dead')continue;
    end=h.point.clone();
    if(z){
      const head=h.object.userData.part==='head';
      const dmg=head?100:34;
      z.hp-=dmg;
      z.flash=1;
      z.hitReact=.3;
      score+=10;
      sHit();
      if(head)sHead();
      blood(h.point,head?14:8,head?4:2.5);
      if(z.type!=='brute'){
        z.group.position.x+=tv2.x*.06;
        z.group.position.z+=tv2.z*.06;
      }
      if(z.hp<=0)kill(z,head);
    }else{
      for(let i=0;i<4;i++)spawnPart(end.x,end.y,end.z,(Math.random()-.5)*2,Math.random()*2,(Math.random()-.5)*2,0x999999,.25,4);
    }
    break;
  }
  gunTip.getWorldPosition(tv2);
  tracer(tv2,end);
  if(ammo<=0)startReload();
  updateHUD();
}

function kill(z,head){
  z.state='dead';
  z.deathT=0;
  z.dirF=1;
  z.fallZ=(Math.random()-.5)*1.2;
  kills++;
  const pts=z.cfg.score+(head?50:0);
  score+=pts;
  popup(head?'HEADSHOT +'+pts:'+'+pts,head?'#ff8080':'#ffd77a');
  sDeath();
  blood(z.group.position.clone().setY(1.2),16,4);
  decal(z.group.position.x,z.group.position.z,.9);
  updateHUD();
}

function startReload(){
  if(reloading||ammo===mag)return;
  reloading=true;
  reloadT=0;
  sReload();
}

function hurt(d){
  player.hp-=d;
  lastHurt=clock.elapsedTime;
  dmgOp=.75;
  shake=Math.min(shake+.3,.6);
  sHurt();
  updateHUD();
  if(player.hp<=0){
    state='over';
    firing=false;
    $('finalStats').innerHTML='SCORE '+score+'<br>WAVES '+wave+' · KILLS '+kills;
    $('over').classList.remove('hidden');
  }
}

/* ---------- waves ---------- */
function startWave(n){
  wave=n;
  toSpawn=2+n*3;
  spawnT=1;
  cleared=false;
  interT=0;
  banner('WAVE '+n);
  sWave();
  updateHUD();
}

/* ---------- input ---------- */
const keys={};
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyR')startReload();});
addEventListener('keyup',e=>keys[e.code]=false);
let mouseLook=false;

addEventListener('mousedown',e=>{
  if(state!=='play')return;
  if(e.button===0)firing=true;
  if(e.button===2)mouseLook=true;
});

addEventListener('mouseup',e=>{
  if(e.button===0)firing=false;
  if(e.button===2)mouseLook=false;
});

addEventListener('mousemove',e=>{
  if(mouseLook&&state==='play'){
    yaw-=e.movementX*.003;
    pitch=Math.max(-1.25,Math.min(1.25,pitch-e.movementY*.003));
  }
});

addEventListener('contextmenu',e=>e.preventDefault());

let stickId=null,lookId=null,sOX=0,sOY=0,sDX=0,sDY=0,lLX=0,lLY=0;
const stickBase=$('stickBase'),stickKnob=$('stickKnob');

document.addEventListener('touchstart',e=>{
  if(state!=='play')return;
  for(const t of e.changedTouches){
    const el=document.elementFromPoint(t.clientX,t.clientY);
    if(el&&el.closest('.ctl'))continue;
    if(t.clientX<innerWidth*.45&&stickId===null){
      stickId=t.identifier;
      sOX=t.clientX;
      sOY=t.clientY;
      sDX=sDY=0;
      stickBase.style.display='block';
      stickBase.style.left=(t.clientX-55)+'px';
      stickBase.style.top=(t.clientY-55)+'px';
    }else if(lookId===null){
      lookId=t.identifier;
      lLX=t.clientX;
      lLY=t.clientY;
    }
  }
  e.preventDefault();
},{passive:false});

document.addEventListener('touchmove',e=>{
  for(const t of e.changedTouches){
    if(t.identifier===stickId){
      let dx=(t.clientX-sOX)/45,dy=(t.clientY-sOY)/45;
      const l=Math.hypot(dx,dy);
      if(l>1){dx/=l;dy/=l;}
      sDX=dx;
      sDY=dy;
      stickKnob.style.transform='translate('+(dx*38)+'px,'+(dy*38)+'px)';
    }else if(t.identifier===lookId){
      yaw-=(t.clientX-lLX)*.0052;
      pitch=Math.max(-1.25,Math.min(1.25,pitch-(t.clientY-lLY)*.0052));
      lLX=t.clientX;
      lLY=t.clientY;
    }
  }
  e.preventDefault();
},{passive:false});

const endT=e=>{
  for(const t of e.changedTouches){
    if(t.identifier===stickId){
      stickId=null;
      sDX=sDY=0;
      stickBase.style.display='none';
    }
    if(t.identifier===lookId)lookId=null;
  }
};

document.addEventListener('touchend',endT);
document.addEventListener('touchcancel',endT);

$('fireBtn').addEventListener('touchstart',e=>{
  e.preventDefault();
  e.stopPropagation();
  if(state==='play')firing=true;
},{passive:false});

$('fireBtn').addEventListener('touchend',e=>{
  e.preventDefault();
  firing=false;
});

$('reloadBtn').addEventListener('touchstart',e=>{
  e.preventDefault();
  e.stopPropagation();
  startReload();
},{passive:false});

/* ---------- zombie animation ---------- */
function animZombie(z,dt){
  const p=z.parts,c=z.cfg;
  if(z.state==='dead'){
    z.deathT+=dt;
    const k=Math.min(1,z.deathT/.5),e=k*k*(3-2*k);
    z.group.rotation.x=e*(Math.PI/2)*z.dirF;
    z.group.rotation.z=e*z.fallZ;
    p.shL.rotation.x=-.3;
    p.shR.rotation.x=-.3;
    p.legL.rotation.x=.25;
    p.legR.rotation.x=-.1;
    if(z.deathT>1.6)z.group.position.y-=dt*.6;
    return;
  }
  z.t+=dt*c.anim;
  const t=z.t;
  let laL=Math.sin(t)*c.swing,laR=-laL;
  let aaL,aaR,azL=.12,azR=-.12,lean=.08,bob=Math.abs(Math.cos(t))*.05;
  if(z.type==='runner'){
    aaL=Math.sin(t+Math.PI)*.8;
    aaR=Math.sin(t)*.8;
    lean=.22;
  }else{
    aaL=-1.25+Math.sin(t)*.12;
    aaR=-1.25+Math.sin(t+1.3)*.12;
  }
  if(z.type==='brute'){
    azL=.55;
    azR=-.55;
    aaL=aaR=-.9;
  }
  if(z.state==='show'){
    bob=Math.abs(Math.cos(t*.6))*.03;
    aaL=-1.1+Math.sin(t*.6)*.15;
    aaR=-1.1+Math.sin(t*.6+2)*.15;
  }
  if(z.state==='rise'){
    z.riseT+=dt;
    const k=Math.min(1,z.riseT/.9),e=1-(1-k)*(1-k);
    z.group.position.y=-1.45*(1-e);
    laL=laR=0;
    bob=0;
    if(k>=1){
      z.state='walk';
      z.group.position.y=0;
    }
  }else{
    z.group.position.y=bob;
  }
  if(z.attackT>0){
    z.attackT+=dt/.45;
    const a=Math.sin(Math.min(z.attackT,1)*Math.PI);
    aaL=aaR=-1.3-a*1.5;
    lean=.3;
    if(z.attackT>=1)z.attackT=0;
  }
  if(z.hitReact>0){
    z.hitReact-=dt;
    lean=-.2;
  }
  p.legL.rotation.x=laL;
  p.legR.rotation.x=laR;
  p.shL.rotation.x=aaL;
  p.shR.rotation.x=aaR;
  p.shL.rotation.z=azL;
  p.shR.rotation.z=azR;
  p.headG.rotation.z=Math.sin(t*.5)*.08;
  p.torso.rotation.x=lean;
  if(z.flash>0)z.flash=Math.max(0,z.flash-dt*5);
  z.mats.forEach(m=>m.emissive.setRGB(z.flash*.9,z.flash*.08,z.flash*.08));
}

/* ---------- game flow ---------- */
function resetGame(){
  zombies.forEach(z=>scene.remove(z.group));
  zombies=[];
  zGroups=[];
  parts.forEach(p=>{p.active=false;p.m.visible=false;});
  tracers.forEach(t=>{t.active=false;t.m.visible=false;});
  decals.forEach(d=>{d.active=false;d.m.visible=false;});
  player.pos.set(0,0,10);
  player.hp=100;
  yaw=0;
  pitch=0;
  score=0;
  kills=0;
  ammo=mag;
  reloading=false;
  firing=false;
  $('over').classList.add('hidden');
  updateHUD();
  state='play';
  startWave(1);
  console.log('Game reset, state:',state);
}

$('startBtn').addEventListener('click',()=>{
  try{
    console.log('START clicked');
    initAudio();
    if(ac&&ac.state==='suspended')ac.resume();
    showcase.forEach(z=>scene.remove(z.group));
    showcase=[];
    gun.visible=true;
    $('menu').classList.add('hidden');
    resetGame();
  }catch(e){
    showError('Start failed: '+e.message);
    console.error(e);
  }
});

$('restartBtn').addEventListener('click',()=>{
  try{
    resetGame();
  }catch(e){
    showError('Restart failed: '+e.message);
  }
});

/* showcase zombies on menu */
try{
  makeZombie('walker',-1.6,0,true);
  makeZombie('brute',0,-.6,true);
  makeZombie('runner',1.6,0,true);
  showcase.forEach(z=>{
    z.group.rotation.y=Math.atan2(0-z.group.position.x,10-z.group.position.z);
    z.state='show';
  });
  console.log('Showcase zombies created:',showcase.length);
}catch(e){
  showError('Menu init failed: '+e.message);
  console.error(e);
}

/* ---------- main loop ---------- */
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),.05);
  const now=clock.elapsedTime;
  
  if(state==='menu'){
    const a=now*.25;
    camera.position.set(Math.sin(a)*6,2.4,Math.cos(a)*6);
    camera.lookAt(0,1.2,0);
    showcase.forEach(z=>animZombie(z,dt));
  }else{
    /* player move */
    let mx=sDX,my=-sDY;
    if(keys.KeyW)my=1;
    if(keys.KeyS)my=-1;
    if(keys.KeyA)mx=-1;
    if(keys.KeyD)mx=1;
    const ml=Math.hypot(mx,my);
    if(ml>1){mx/=ml;my/=ml;}
    const sp=4.6;
    tv1.set(-Math.sin(yaw),0,-Math.cos(yaw));
    tv2.set(Math.cos(yaw),0,-Math.sin(yaw));
    player.pos.addScaledVector(tv1,my*sp*dt).addScaledVector(tv2,mx*sp*dt);
    const pr=Math.hypot(player.pos.x,player.pos.z);
    if(pr>45){player.pos.x*=45/pr;player.pos.z*=45/pr;}
    for(const c of colliders){
      const dx=player.pos.x-c.x,dz=player.pos.z-c.z,d=Math.hypot(dx,dz),rr=c.r+.4;
      if(d<rr&&d>0.001){
        player.pos.x=c.x+dx/d*rr;
        player.pos.z=c.z+dz/d*rr;
      }
    }
    bobT+=dt*6*Math.min(1,ml);
    shake*=Math.exp(-dt*6);
    camera.position.set(player.pos.x,1.62+Math.sin(bobT)*.035+(Math.random()-.5)*shake*.08,player.pos.z);
    camera.rotation.set(pitch+(Math.random()-.5)*shake*.12,yaw,(Math.random()-.5)*shake*.12);
    moonL.position.set(player.pos.x+25,40,player.pos.z-20);
    moonL.target.position.copy(player.pos);
    
    if(state==='play'){
      /* regen */
      if(now-lastHurt>5&&player.hp<100&&player.hp>0){
        player.hp=Math.min(100,player.hp+2*dt);
        updateHUD();
      }
      /* firing */
      shotCd-=dt;
      if(firing&&shotCd<=0&&!reloading){
        if(ammo>0)shoot();
        else{sDry();startReload();}
      }
      /* reload anim */
      if(reloading){
        reloadT+=dt/1.6;
        magMesh.visible=!(reloadT>.25&&reloadT<.75);
        if(reloadT>=1){
          reloading=false;
          ammo=mag;
          magMesh.visible=true;
          updateHUD();
        }
      }
      /* waves */
      if(toSpawn>0){
        spawnT-=dt;
        if(spawnT<=0&&zombies.filter(z=>z.state!=='dead').length<14){
          spawnZombie();
          toSpawn--;
          spawnT=Math.max(.35,2-wave*.12);
        }
      }else if(zombies.length===0&&!cleared){
        cleared=true;
        score+=250;
        banner('WAVE CLEARED  +250');
        updateHUD();
      }else if(cleared){
        interT+=dt;
        if(interT>3.5)startWave(wave+1);
      }
      /* zombies */
      for(let i=zombies.length-1;i>=0;i--){
        const z=zombies[i];
        if(z.state==='dead'){
          animZombie(z,dt);
          if(z.deathT>2.8){
            scene.remove(z.group);
            zombies.splice(i,1);
            zGroups.splice(i,1);
          }
          continue;
        }
        animZombie(z,dt);
        if(z.state==='walk'){
          const dx=player.pos.x-z.group.position.x,dz=player.pos.z-z.group.position.z,d=Math.hypot(dx,dz);
          z.group.rotation.y=Math.atan2(dx,dz);
          if(d>z.cfg.range){
            z.group.position.x+=dx/d*z.speed*dt;
            z.group.position.z+=dz/d*z.speed*dt;
          }else{
            z.cd-=dt;
            if(z.attackT===0&&z.cd<=0){
              z.attackT=.001;
              z.hitDone=false;
              z.cd=1.15;
            }
            if(z.attackT>.5&&!z.hitDone){
              z.hitDone=true;
              if(d<z.cfg.range+.4)hurt(z.cfg.dmg);
            }
          }
        }
        z.groanT-=dt;
        if(z.groanT<=0){
          z.groanT=4+Math.random()*6;
          const gd=z.group.position.distanceTo(player.pos);
          sGroan(Math.max(0,1-gd/28)*.5);
        }
      }
      /* separation */
      for(let i=0;i<zombies.length;i++){
        for(let j=i+1;j<zombies.length;j++){
          const a=zombies[i].group.position,b=zombies[j].group.position;
          const dx=b.x-a.x,dz=b.z-a.z,d=Math.hypot(dx,dz);
          if(d<1&&d>.001){
            const push=(1-d)*.5;
            a.x-=dx/d*push;
            a.z-=dz/d*push;
            b.x+=dx/d*push;
            b.z+=dz/d*push;
          }
        }
      }
    }
  }
  
  /* fx updates */
  recoil*=Math.exp(-dt*10);
  flashT-=dt;
  if(flashT<=0){flashM1.visible=flashM2.visible=false;}
  muzzleLight.intensity*=Math.exp(-dt*20);
  const tilt=reloading?Math.sin(Math.min(reloadT,1)*Math.PI)*-.8:0;
  gun.position.set(.24+Math.sin(bobT)*.008,-.2+Math.abs(Math.cos(bobT))*.008,-.45+recoil*.07);
  gun.rotation.x=recoil*.1+tilt;
  gun.rotation.y=-.04;
  
  parts.forEach(p=>{
    if(!p.active)return;
    p.life-=dt;
    if(p.life<=0){p.active=false;p.m.visible=false;return;}
    p.v.y-=p.grav*dt;
    p.m.position.addScaledVector(p.v*dt,1);
    p.m.material.opacity=p.life/p.life0;
  });
  
  tracers.forEach(t=>{
    if(!t.active)return;
    t.life-=dt;
    if(t.life<=0){t.active=false;t.m.visible=false;return;}
    t.m.material.opacity=t.life/.07*.9;
  });
  
  decals.forEach(d=>{
    if(!d.active)return;
    d.life-=dt;
    if(d.life<=0){d.active=false;d.m.visible=false;return;}
    d.m.material.opacity=d.life/d.life0*.75;
  });
  
  dmgOp*=Math.exp(-dt*3);
  dmgEl.style.opacity=Math.min(1,dmgOp+(player.hp<30?.15:0));
  
  renderer.render(scene,camera);
}

loop();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

console.log('Game fully initialized, state:',state);
</script>
